name: CI Pipeline - AI Bug Prediction System

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ai_bug_prediction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./web
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./web
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ai_bug_prediction_test

      - name: Typecheck Next.js & TypeScript
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Run Test Suite
        working-directory: ./web
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ai_bug_prediction_test
          NEXTAUTH_SECRET: test-ci-secret-key-32characters-minimum

      - name: Build Next.js Production Bundle
        working-directory: ./web
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ai_bug_prediction_test
          NEXTAUTH_SECRET: test-ci-secret-key-32characters-minimum
